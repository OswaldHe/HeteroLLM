# Kernel Configuration for U55C FPGA
# This file specifies memory bank assignments and kernel instances

[connectivity]
# Map index generator kernel to HBM bank 0 (P2P accessible)
sp=fpga_index_generator_1.indices:HBM[0]

# For burst version
sp=fpga_index_generator_burst_1.indices:HBM[0]

# Kernel instances
nk=fpga_index_generator:1
nk=fpga_index_generator_burst:1
