# Kernel Configuration for Engram FPGA on U55C
# Maps kernel memory ports to HBM banks
#
# Floorplan-aware assignment (build/dse/solution_3/floorplan.json):
#   SLOT_X0Y* modules -> HBM[0-15]  (channels 1,4,7,10,13 left free for sparsity)
#   SLOT_X1Y* modules -> HBM[16-31] (all 16 channels used)

[connectivity]
# --- X0Y* modules -> HBM[0-15], sparse (alternating gap-2/gap-1 pattern) ---
# embed_lo {1,2,7}, embed_hi {1,2,7}, kv {1,2,7}, output_mem {0,1}: 11 modules
# Channels used: 0,2,3,5,6,8,9,11,12,14,15  Free: 1,4,7,10,13

sp=engram_fpga_top.embed_mem_lo_1:HBM[0]
sp=engram_fpga_top.embed_mem_lo_2:HBM[2]
sp=engram_fpga_top.embed_mem_lo_7:HBM[3]
sp=engram_fpga_top.embed_mem_hi_1:HBM[5]
sp=engram_fpga_top.embed_mem_hi_2:HBM[6]
sp=engram_fpga_top.embed_mem_hi_7:HBM[8]
sp=engram_fpga_top.kv_weight_mem_1:HBM[9]
sp=engram_fpga_top.kv_weight_mem_2:HBM[11]
sp=engram_fpga_top.kv_weight_mem_7:HBM[12]
# Output (P2P accessible) -> X0Y* side, 2 channels (tok0 and tok1)
sp=engram_fpga_top.output_mem_0:HBM[14]
sp=engram_fpga_top.output_mem_1:HBM[15]

# --- X1Y* modules -> HBM[16-31], all 16 channels used ---
# token_id, embed_lo {0,3,4,5,6}, embed_hi {0,3,4,5,6}, kv {0,3,4,5,6}: 16 modules

sp=engram_fpga_top.token_id_mem:HBM[16]
sp=engram_fpga_top.embed_mem_lo_0:HBM[17]
sp=engram_fpga_top.embed_mem_lo_3:HBM[18]
sp=engram_fpga_top.embed_mem_lo_4:HBM[19]
sp=engram_fpga_top.embed_mem_lo_5:HBM[20]
sp=engram_fpga_top.embed_mem_lo_6:HBM[21]
sp=engram_fpga_top.embed_mem_hi_0:HBM[22]
sp=engram_fpga_top.embed_mem_hi_3:HBM[23]
sp=engram_fpga_top.embed_mem_hi_4:HBM[24]
sp=engram_fpga_top.embed_mem_hi_5:HBM[25]
sp=engram_fpga_top.embed_mem_hi_6:HBM[26]
sp=engram_fpga_top.kv_weight_mem_0:HBM[27]
sp=engram_fpga_top.kv_weight_mem_3:HBM[28]
sp=engram_fpga_top.kv_weight_mem_4:HBM[29]
sp=engram_fpga_top.kv_weight_mem_5:HBM[30]
sp=engram_fpga_top.kv_weight_mem_6:HBM[31]

